[project]
name = "fnoreg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.12,<3.11"
dependencies = [
    "flow-vis==0.1",
    "h5py==3.11.0",
    "matplotlib==3.9.2",
    "ml-collections==0.1.1",
    "neuraloperator==0.2.0",
    "nibabel==5.2.1",
    "numpy==1.26.4",
    "nvidia-cuda-nvrtc-cu11==11.8.89",
    "opencv-python-headless==4.10.0.84",
    "opt-einsum==3.3.0",
    "pandas==2.2.3",
    "prettytable==3.11.0",
    "pystrum==0.4",
    "scipy==1.14.1",
    "tensorboard==2.17.1",
    "tensorly==0.8.1",
    "tensorly-torch==0.5.0",
    "timm==1.0.9",
    "torch==2.1.0+cu118",
    "torchaudio==2.1.0+cu118",
    "torchvision==0.16.0+cu118",
    "tqdm==4.66.5",
    "wandb==0.18.1",
    "zarr==2.18.3",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
